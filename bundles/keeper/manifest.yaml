name: keeper
type: compose
features:
  docker_log_rotation: true
  git_clone:
    repo: https://github.com/singll/Bellkeeper.git
    path: bellkeeper
  docker_prune: true
defaults:
  - path: .env
    content: |
      # ==============================================================================
      #  Keeper Stack Environment Variables
      # ==============================================================================

      # --- 容器前缀 ---
      APP_PREFIX=sp-

      # --- 跨服务器通信 ---
      # knowledge 服务器 IP (Firecrawl + 其他外部辅助服务)
      KNOWLEDGE_HOST=192.168.7.220

      # --- Redis ---
      REDIS_PASSWORD=CHANGE_ME_redis_password

      # --- n8n ---
      # WebUI owner 登录凭证 (n8n-init.sh 启动自愈: 重建/恢复后凭证恒为这两项)
      N8N_OWNER_EMAIL=CHANGE_ME_owner_email
      N8N_OWNER_FIRSTNAME=Owner
      N8N_PASSWORD=CHANGE_ME_n8n_password
      # 固定加密密钥 (重要! 确保凭证在容器重建后不丢失, 请生成随机字符串)
      N8N_ENCRYPTION_KEY=CHANGE_ME_generate_random_string

      # --- Bellkeeper ---
      BELLKEEPER_DB_PASSWORD=CHANGE_ME_bellkeeper_db_password
      BELLKEEPER_API_KEY=your-bellkeeper-api-key

      # --- LLM Proxy ---
      LLM_NEWAPI_BASE_URL=
      LLM_NEWAPI_API_KEY=
      LLM_DEEPSEEK_API_KEY=
      LLM_KIMI_API_KEY=

      # --- Memos ---
      MEMOS_API_TOKEN=your-memos-api-token
      # MEMOS_PUBLIC_URL=https://memos.example.com

      # --- CouchDB (Obsidian LiveSync) ---
      COUCHDB_USER=admin
      COUCHDB_PASSWORD=CHANGE_ME_couchdb_password
      COUCHDB_SECRET=CHANGE_ME_couchdb_secret
templates:
  - 00-base.yaml
  - 10-redis.yaml
  - 12-meilisearch.yaml
  - 15-nats.yaml
  - 20-n8n.yaml
  - 30-apps.yaml
  - 40-couchdb.yaml
  - 50-bellkeeper.yaml
services:
  - bellkeeper
  - bellkeeper-db
  - n8n
  - memos
  - rsshub
  - couchdb
  - redis
  - meilisearch
  - nats
