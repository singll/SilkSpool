services:
  memos:
    image: neosmemo/memos:0.22.3@sha256:87efa7fc67b216c9506ffa46bc3c77d86bf1284bfb99af3819712026e4a06279
    container_name: ${APP_PREFIX:-sp-}memos
    restart: unless-stopped
    ports:
      - "5230:5230"
    environment:
      - TZ=Asia/Shanghai
      - MEMOS_PUBLIC_URL=${MEMOS_PUBLIC_URL:-}
    volumes:
      - kp-memos-data:/var/opt/memos
    networks:
      - kp-network

  rsshub:
    image: diygod/rsshub:2025-01-01@sha256:74daabd51c2121eae161e1d149233d63d43591335794fd62d4cf0004a294fd3f
    container_name: ${APP_PREFIX:-sp-}rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/"
    extra_hosts:
      - "redis:192.168.7.231"
      - "sp-redis:192.168.7.231"
    networks:
      - kp-network
