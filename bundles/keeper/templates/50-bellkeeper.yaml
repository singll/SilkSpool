# ==============================================================================
#  Bellkeeper - Knowledge Management System
#  描述: Go + SolidJS 全栈应用
#  依赖: PostgreSQL (独立实例), 连接 n8n (同机) / Meilisearch (同机)
# ==============================================================================

services:
  bellkeeper:
    build:
      context: ./bellkeeper
      dockerfile: docker/Dockerfile
    image: bellkeeper:latest
    container_name: ${APP_PREFIX:-sp-}bellkeeper
    restart: unless-stopped
    ports:
      - "8090:8080"
    entrypoint: ["/bin/sh"]
    command: ["/app/scripts/bellkeeper-init.sh"]
    environment:
      # 仅保留 Docker 层面必需的变量 (几乎不变, 无需热更新)
      # 其余所有变量由 init 脚本从挂载的 .env 文件动态加载
      # → 修改 .env 后只需 docker compose restart bellkeeper, 无需 up -d 重建容器
      - TZ=Asia/Shanghai
    volumes:
      - ./bellkeeper-init.sh:/app/scripts/bellkeeper-init.sh:ro
      - ./.env:/app/config/.env:ro
      - /mnt/NAS/data/knowledge:/mnt/knowledge:rw
    # 数据层已剥离到 silkdata(.231)；用 extra_hosts 把数据服务名解析到数据机，
    # 应用连接串(config 默认 sp-* 容器名)无需改动。sp- 名与裸服务名都映射，覆盖所有解析路径。
    extra_hosts:
      - "sp-bellkeeper-db:192.168.7.231"
      - "bellkeeper-db:192.168.7.231"
      - "sp-meilisearch:192.168.7.231"
      - "meilisearch:192.168.7.231"
      - "sp-redis:192.168.7.231"
      - "redis:192.168.7.231"
      - "sp-nats:192.168.7.231"
      - "nats:192.168.7.231"
      - "sp-couchdb:192.168.7.231"
      - "couchdb:192.168.7.231"
    networks:
      - kp-network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# bellkeeper-db 已迁移到 silkdata(.231) 数据层，见 bundle silkdata / 50-postgres.yaml。
# 旧卷 kp-bellkeeper-db 保留在 keeper 上作回滚兜底（≥7 天）。
