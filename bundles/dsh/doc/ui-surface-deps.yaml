# ── 逐面挂点声明 ────────────────────────────────────────────────────────────
# 字段：slots=注册的槽（name 形态）；slots_inject=ctx 级注入的槽；services_provide
# =本面提供的 cordis 客户端服务；services_consume=消费的官方服务/方法；primitives
# =用到的官方可复用组件；icons=用到的官方图标；degradation=降级链。
surfaces:
  - id: ui-core
    package: "@silksec/ui-core"
    phase: P0
    status: implemented
    role: 共享内核（token/ErrorBoundary/hooks/secUiBus/视图注册表/共享组件）
    slots: []
    services_provide:
      - secDashboardViews   # 视图注册表（16-dashboard §1.1 协议等价物）
      - secUiBus            # 跨面客户端微事件（open:approval / refresh:badges …）
    services_consume:
      - slots               # ctx.inject 声明；仅经 ctx.get 读取，缺失不影响启动
    primitives:
      - Modal               # DocModal 容器（prim 缺失时降级为不渲染）
    icons: []
    dsh_client_inject: []
    degradation: []

  - id: dashboard-panel
    package: "@silksec/ui-panel"
    phase: P1
    status: implemented
    role: 看板本体（主面板 + 侧边栏一级导航行；footer/Modal 降级入口由 sec-dashboard legacy 承接）
    implementation:
      client: dsh-plugin-silksec-ui-panel.client.js
      host: dsh-plugin-silksec-ui-panel.index.js
      setup: silksec-ui-panel-plugin-setup.sh
      registry_components: dsh-plugin-sec-dashboard.client.js（自足 wrapper，P1 重构）
    slots:
      - main                          # keyed 槽（root；保留键 conversation）→ DashboardPanel。**用 options.key**（P1 实测：keyed 只认 key，list 才认 id）
      - sidebar.panellist             # list 槽（owner props {size, active}）→ PanelIcon（用 options.id）
      - sidebar.footer.action         # list 槽；P1 由 sec-dashboard legacy SidebarAction 单条承接（避免重复），
                                      # 行为改为 panelSlotAvailable() ? selectPanel : 开 Modal
    services_consume:
      - layout.selectPanel            # ctx.layout.selectPanel(id) / selectPanel(null)
      - layout.beginNavigation        # ctx.layout.beginNavigation() → AbortSignal（防连点竞态）
      - slots.register
      - slots.inject                  # 声明生命周期注册（时序纪律；panellist 缺席静默降级）
      - slots.entriesOfSlot           # legacy footer 能力探测 main 槽是否已注册（非版本判断）
    owner_props_consume:
      - SidebarPanelIconOwnerProps    # sidebar.panellist {size, active}
    primitives: []                    # 页头/KPI/tab 走 ui-core styles/T；主面板不再依赖 primitives Modal
    icons: []
    my_icons: [spoolIcon]
    slots_avoid:
      - conversation.chat.turnTail    # chain 槽首匹配即占用，纪律：不碰
    degradation:
      - main + sidebar.panellist + selectPanel
      - sidebar.panellist 缺席 → sidebar.footer.action + selectPanel（legacy 入口承接）
      - layout / main 槽缺席 → 现状 Modal（legacy SidebarAction 承接，观察期保留）
    rollback:
      - localStorage 'silksec.ui.dashboard.mode' = 'modal' 强制 Modal（保留旧 sec-dashboard 入口）
      - 或从 web profile 移除 @silksec/ui-panel（legacy footer 探测不到 main 槽即回落 Modal）
    notes:
      - "P1 面板为通用渲染器：消费 ui-core viewRegistry（list() 按 order），传统一 prop bag
         { rpc, workspaces, stats, approvals, memcore, ops, navigate, pending, reloadShared }。
         11 视图在 sec-dashboard legacy 侧登记为自足 wrapper（内部自持 query/handler，
         复用旧 props 契约；视图文件不拆、行为不变）。旧 DashboardShell/Modal 路径零改动。"
      - "开放问题 §九 #1：P1 未做 URL hash 直达。selectPanel 为 DSH 原生内存态（刷新回会话，
         官方默认）；自管 hash 属自绘层，未采用。"
      - "开放问题 §九 #4：零会话时主面板（root scope）照常可达；右侧栏 tab 属 P2 范畴。"
    verified_dsh: "0.1.5-rc.2 (2026-09-18；ctx.layout service.d.ts + sidebar contract/slots.d.ts + main/panellist SlotMap 逐字核对)"

  - id: approval
    package: "@silksec/ui-approval"
    phase: P2
    status: implemented
    role: 待审批待办（shell.overlay 胶囊 + 快捷处理浮卡 + 审批右侧栏 page tab）
    implementation:
      client: dsh-plugin-silksec-ui-approval.client.js
      host: dsh-plugin-silksec-ui-approval.index.js
      setup: silksec-ui-approval-plugin-setup.sh
      tests: dsh-plugin-silksec-ui-approval.client.test.mjs（10 例）
    slots:
      - shell.overlay                 # list，root；additive、点击穿透，条目自 pointerEvents:'auto'（用 options.id）
      - sidebar.right.pane.tab        # keyed 槽（key=类型 id，scope session）承载 tab 体
      - sidebar.right.pane.tab.title  # keyed 槽（key=类型 id）承载动态标题（「审批 · N」每次渲染重读共享计数）
    services_consume:
      - sidebarRightTabs.register     # **实测名称**：SidebarRightTabRegistry.register(definition)
                                      # （{ id, kind, priority, title(address), guide? }；非设计稿的 registerType）
      - sidebarRight.openTab          # ctx.sidebarRight.openTab('silksec-approval')；无在屏会话 seat 时抛错 → 降级
      - slots.register
      - slots.inject                  # 声明生命周期注册（时序纪律；槽缺席静默降级）
      - slots.spec                    # 能力探测槽声明是否存在（shell.overlay 缺席 → 徽章降级）
      - connection.rpc.call           # /silksec-dashboard → approvalList / approvalDecide（actor=dashboard+operator）
      - layout.selectPanel            # 降级：主面板（silksec-dashboard）
    owner_props_consume:
      - TabHookContext                # sidebar.right.pane.tab / .title 的 hookContext（本面不读，仅声明消费面）
    primitives:
      - Modal                         # 主面板/layout 也缺席时的 Modal 降级（缺席自绘 fixed 覆盖层）
      - StateDot                      # 待审批/已批准/已驳回状态点（state: warning/done/error）
      - HoverCard                     # 判据悬停卡（anchor/content；缺席退回 title）
      - Tooltip                       # 图标/按钮 title 悬停纪律（label/side/delayMs；缺席退回 title）
    primitives_deferred:
      - Pill                          # rc.2 客户端 bundle 未观测到稳定导出；chip 走 ui-core pill 样式
      - RiskConfirmation              # P2 驳回沿用 legacy 备注 prompt；预留 P5 会话表单（§七.5）
    icons:
      - IconWarningOutline            # 胶囊/纪律告警
      - IconChecklistOutline          # 待审批语义 + 右侧栏 guide 图标
    degradation:
      - shell.overlay 胶囊 + sidebarRightTabs page tab
      - sidebarRightTabs 缺席 → 同一视图注册进 ui-core 注册表（主面板「审批 ·降级」临时 tab）
      - 主面板 / layout 也缺席 → primitives Modal（再缺席自绘覆盖层）
      - shell.overlay 缺席 → secUiBus 广播 approval:pending（footer.action 由 sec-dashboard legacy
        单条持有，不重复注册；主面板 approvals tab 自带计数兜底）
      - 无在屏会话 openTab 抛错 → secUiBus open:approval + layout.selectPanel（或 Modal）
    rollback:
      - 从 web profile 移除 @silksec/ui-approval（胶囊/右栏 tab 消失；主面板 legacy「审批」tab 照常）
    notes:
      - "计数真相源 = /silksec-dashboard approvalList 的 pending；胶囊、右侧栏动态标题、降级视图
         共用 ui-core 之外的本包 approvalStore（模块级共享快照）。"
      - "写路径与主面板等价：approvalDecide RPC → approval.decide（actor=dashboard + operator 由
         RpcProjector 注入），kind.onApprove 副作用与 audit 留痕一致。"
      - "开放问题 §九 #6 修正：类型声明中定义 title(address) 是 open 时捕获的 chip 初值；动态计数
         须注册 keyed sidebar.right.pane.tab.title 体（已落地），非『thunk 每渲染重读』。"
    verified_dsh: "0.1.5-rc.2 (2026-09-18；sidebar-right tab-registry/service/slots 与 layout shell.overlay 类型声明逐字核对；无会话 openTab 抛错、shell.overlay 点击穿透语义实测)"

  - id: task
    package: "@silksec/ui-task"
    phase: P3
    status: implemented
    role: 任务右侧栏 page tab（定时任务卡片 + 一次性队列 + 工作区快块 + 执行历史）+ 会话头「本会话任务」计数
    implementation:
      client: dsh-plugin-silksec-ui-task.client.js
      host: dsh-plugin-silksec-ui-task.index.js
      setup: silksec-ui-task-plugin-setup.sh
      tests: dsh-plugin-silksec-ui-task.client.test.mjs（11 例）
    slots:
      - sidebar.right.pane.tab        # keyed 槽（key=类型 id，scope session）承载 tab 体（四区块）
      - sidebar.right.pane.tab.title  # keyed 槽（key=类型 id）承载动态标题（「任务 · N」每次渲染重读共享计数）
      - conversation.session.header.utilities  # list，右对齐（本会话活跃任务计数；owner props 无专属值，运行时 props 含 sessionId）
    services_consume:
      - sidebarRightTabs.register     # **P2 实测名称**：SidebarRightTabRegistry.register(definition)
                                      # （{ id, kind, priority, title(address), guide? }；设计稿 registerType 有误）
      - sidebarRight.openTab          # ctx.sidebarRight.openTab('silksec-task')；无在屏会话 seat 时抛错 → 降级
      - slots.register
      - slots.inject                  # 声明生命周期注册（时序纪律；槽缺席静默降级）
      - layout.selectPanel            # 降级：主面板（silksec-dashboard）
      - connection.rpc.call           # /silksec-dashboard → 读 scheduledTasks/tasks/taskRuns/workspaces；
                                      # 写 taskRunNow/taskCancel/taskSetStatus/taskScheduleUpdate/taskCreate
                                      # （task.run_now/cancel/block/resume/schedule/create，actor=dashboard+operator）
    owner_props_consume:
      - ConversationHeaderActionOwnerProps   # conversation.session.header.utilities owner（children?: never）；
                                             # 运行时 props 携带 sessionId / useSessions（官方 open-in-app 同槽先例）
      - TabHookContext                       # sidebar.right.pane.tab / .title 的 hookContext（本面不读，仅声明消费面）
    primitives:
      - Pill                          # 状态/筛选/元信息胶囊（active + onClick；缺席走 ui-core pill 样式）
      - StateDot                      # 队列/定时状态点（ongoing/warning/done/error）
      - DisclosureRow                 # 执行历史默认折叠区（title/open/onToggle/icon；缺席走自绘折叠头）
      - Tooltip                       # 图标/按钮 title 悬停纪律（label/side/delayMs；缺席退回 title）
      - Modal                         # 主面板/layout 也缺席时的 Modal 降级（缺席自绘 fixed 覆盖层）
    primitives_deferred:
      - RiskConfirmation              # 任务行内操作为低风险（run_now/cancel/block/resume/edit schedule），
                                      # 沿用原生 confirm/prompt；RiskConfirmation 预留 P5 会话写表单
    icons:
      - IconAlarmClockOutline         # 定时任务语义 + 右侧栏 guide 图标 + 会话头计数钮
      - IconQueueOutline              # 一次性队列语义
      - IconClockOutline              # 执行历史语义（未导出时回退 ui-core opIcon('history')）
    degradation:
      - sidebarRightTabs page tab + conversation.session.header.utilities 计数
      - sidebarRightTabs 缺席 → 同一任务视图注册进 ui-core 注册表（主面板「任务 ·降级」临时 tab）
      - 主面板 / layout 也缺席 → primitives Modal（再缺席自绘覆盖层）
      - conversation.session.header.utilities 缺席 → 不注册（会话面无全局影响）
      - 无在屏会话 openTab 抛错 → secUiBus open:task + layout.selectPanel（或 Modal）
    rollback:
      - 从 web profile 移除 @silksec/ui-task（右侧栏 tab / 会话头计数消失；主面板 legacy「任务」tab 照常）
    notes:
      - "活跃计数真相源（tab 标题 + 会话头共用）= task.scheduled 未终态行 + task.list(active) 非定时行；
         会话头按运行时 props.sessionId 过滤两数组（本会话任务数）。"
      - "四区块栏宽自适应：container-type:inline-size + @container (max-width:480px)，表格 <480px 换卡片行
         （资产视图双模式先例）；工作区快块在窄栏由顶部 program 筛选 Pill 组承接。零颜色字面量（走 --dsw-alias-*）。"
      - "写路径与主面板等价：taskAction(op) → 同 RPC 端点/参数；actor=dashboard + operator 由 RpcProjector 注入，
         audit 留痕与主面板任务 tab 一致。"
      - "会话内审批卡/任务卡 spike 不在 P3；P3 不动主面板 id='tasks' 分支行为（观察期保留）。"
