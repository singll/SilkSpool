# ==============================================================================
# ui-surface-deps — 看板 UI 原生面「官方挂点清单」（19-ui-surface §六.1）
#
# 作用：把每个 UI 包实际消费的 DSH 官方承载面（槽名 / 服务 / 方法 / primitives
# 组件 / 官方图标）显式登记。DSH 升级（freeze→prepare→switch）时按新旧 tag diff
# 清单内的挂点文件（dsh-client-ui-*/lib/types/** + primitives 导出表）：
#   命中哪个面的清单 → 复验哪个面；未命中的面直接放行 → 「升级尽量不动」。
#
# 维护纪律：新增/改动一个面对官方挂点的消费 → 同一次提交更新本清单。
# 契约版本：1 ｜ 设计真相源：doc/secagent/v5/19-ui-surface.md
# ==============================================================================

contract_version: 1
design_doc: doc/secagent/v5/19-ui-surface.md

verified_dsh:
  version: 0.1.5-rc.2
  verified_at: "2026-09-18"
  method: >
    对 csai 生产 npm 包 @deepseek-ai/dsh-client-ui-{layout,sidebar,sidebar-right,
    conversation,chat,settings,primitives,slots} 的 lib/types/**.d.ts 逐字核对；
    槽名以各 client/contract/slots.d.ts 的 keyed 声明为准，另以 dsh-client-modules
    的 WebBootEntry 契约核对 dsh.client.inject 的跨包 factory 到达语义。
  upgrade_policy: >
    rc 间升级先 diff 本文件所引用的挂点（槽名/服务方法/primitives/图标）；
    diff 未命中 → 只更新本文件的 verified_dsh 徽章，零代码改动；
    命中 → 只动命中的面（适配层），并在本文件对应 surface 记录影响。

# ── P7 收尾状态（2026-09-18） ──────────────────────────────────────────────
# 文档/主题 v4.2/accept UI 冒烟已固化；旧单体 @silksec/sec-dashboard 的删除
# （含 dashboard-panel 的 footer/Modal legacy 承接、dashboard-domain-views 的 -old 并排）
# 按 P6 7 天并排观察闸口（起点 2026-09-18，闸口 ≥2026-09-25）顺延——未满不删。
# 删除执行时须：移除本文件 dashboard-panel 的 legacy 承接描述、dashboard-domain-views
# 的 legacy_side_by_side/-old 项与「P6 不删旧路径」降级行；sec-v5-accept.sh 的 UI 冒烟
# 已按删除后口径编写（只要求 13 个 UI 包，不要求 @silksec/sec-dashboard）。
p7_review:
  doc_backfill: true          # 16-dashboard §六 + 19-ui-surface 头部/§八
  theme_v42: true             # doc/silksong-theme-design.md §十一
  accept_ui_smoke: true       # sec-v5-accept.sh R5（结构断言 + --ui-headless 运行时断言）
  legacy_deletion: deferred   # 闸口 >=2026-09-25（未满不删）

# ── 开放问题 §九 #5：ui-core 跨 bundle require ──────────────────────────────
# 结论：可行（P0 已本地契约验证 + csai 部署验证）。
# 证据：dsh-client-modules 契约（lib/types/client/manifest.d.ts + lib/client.js）：
#   - WebBootEntry.inject「names package rows whose factories must arrive before
#     this row materializes」；
#   - ClientModuleSystem.arriveGraphRow 对 row.inject 逐包 arrive 后，消费方
#     factory 同步物化时 makeRequire 命中已注册 factory → 跨包 require 成功；
#   - require('<pkg>/client') 与 require('<pkg>') 经 stripClientSuffix 归一。
#   - 官方先例：client bundle require('@deepseek-ai/dsh-client-ui-primitives')。
# 落地：@silksec/ui-core 独立 client bundle；sec-dashboard 在
#   package.json dsh.client.inject 声明 "@silksec/ui-core" 后直接 require 内核。
# 备选（未采用，仅在 inject 语义变更时启用）：ui-core 以源码并入各包构建。
cross_bundle_require:
  feasible: true
  mechanism: dsh.client.inject + ModuleLoader 跨 bundle factory 到达
  evidence: dsh-client-modules@0.1.5-rc.2 lib/types/client/manifest.d.ts · lib/client.js
  consumer_example: "@silksec/sec-dashboard dsh.client.inject 含 @silksec/ui-core"
  fallback: ui-core 源码并入各包构建（牺牲体积换零风险）

