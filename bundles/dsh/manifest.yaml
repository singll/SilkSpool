name: dsh
type: script
defaults:
  - path: dsh/.env
    content: |
      # ==============================================================================
      #  SilkSecAgent (DSH) Environment Variables (systemd EnvironmentFile 注入)
      # ==============================================================================

      # --- Bellkeeper LLM 网关（默认路由，额度/熔断/粘性/模型组统一调度）---
      BELLKEEPER_LLM_API_KEY=CHANGE_ME_bellkeeper_llm_token

      # --- 模型供应商直连 key（应急回退；默认不走这里）---
      DEEPSEEK_API_KEY=CHANGE_ME_api_key
      # OPENAI_API_KEY=
      # MOONSHOT_API_KEY=
      # ANTHROPIC_API_KEY=

      # --- OpenCode Go 套餐（应急回退；baseURL 填在 settings.yaml）---
      OPENCODE_GO_API_KEY=CHANGE_ME_opencode_go_key

      # --- 出口代理（mubeng 轮换网关，本 bundle 纳管）---
      SEC_EGRESS_PROXY=http://127.0.0.1:8899
      # --- 代理池数据目录（proxy-pool 插件读取）---
      SEC_PROXY_POOL_DIR=/opt/silkspool/dsh/proxy-pool
templates:
  - setup.sh
  - settings.yaml
  - silksecagent.service
  - silksecagent-edge.service
  - edge-Caddyfile
  - edge-static/browser.html
