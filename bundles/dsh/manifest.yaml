name: dsh
type: script
defaults:
  - path: dsh/.env
    content: |
      # ==============================================================================
      #  SilkSecAgent (DSH) Environment Variables (systemd EnvironmentFile 注入)
      # ==============================================================================

      # --- 模型供应商直连 key（不走任何网关）---
      # DSH 主模型在 Web UI 设置中配置（base_url 填供应商官方地址，key 引用下列变量）；
      # 自研插件 / pi-ai 模型路由也读取下列变量
      DEEPSEEK_API_KEY=CHANGE_ME_api_key
      # OPENAI_API_KEY=
      # MOONSHOT_API_KEY=
      # ANTHROPIC_API_KEY=

      # --- OpenCode Go 套餐（多供应商切换的第二优先级；baseURL 填在 settings.yaml）---
      OPENCODE_GO_API_KEY=CHANGE_ME_opencode_go_key

      # --- 出口代理（mubeng 轮换网关，本 bundle 纳管）---
      SEC_EGRESS_PROXY=http://127.0.0.1:8899
      # --- 代理池数据目录（proxy-pool 插件读取）---
      SEC_PROXY_POOL_DIR=/opt/silkspool/dsh/proxy-pool
templates:
  - setup.sh
  - silksecagent.service
  - silksecagent-edge.service
  - edge-Caddyfile
  # --- 一键升级（spool bundle dsh upgrade csai）---
  - dsh-upgrade.sh
  # --- 安全工具链管理（安装/升级/卸载，幂等）---
  - tools-manager.sh
  # --- 工具清单（tools-manager 读取）---
  - tools.list
  # --- 授权白名单初始模板 ---
  - scope.yml
  # --- 代理池基础设施（mubeng 网关 + 采集/分级/定时刷新，自 CyberStrikeAI 迁移纳管）---
  - proxy-pool-infra-setup.sh
  - proxy-pool-run-refresh.sh
  - proxy_grade.py
  - proxy-scraper-checker.toml
  - silksec-proxy-rotator.service
  - silksec-proxy-refresh.service
  # --- xray 被动扫描（流量总线 v1）---
  - silksec-xray.service
  # --- 代理池 dsh 原生插件（替代 MCP 模式）---
  - dsh-plugin-proxy-pool.js
  - dsh-plugin-proxy-pool.patch.yml
  - proxy-pool-plugin-setup.sh
  # --- 安全套件插件（sec-cli-adapter + scope-guard 硬校验 + asset-graph）---
  - dsh-plugin-sec-suite.js
  - dsh-plugin-sec-suite.asset-db.js
  - dsh-plugin-sec-suite.asset-graph.js
  - dsh-plugin-sec-suite.experience.js
  - dsh-plugin-sec-suite.parsers.js
  - dsh-plugin-sec-suite.patch.yml
  - sec-suite-plugin-setup.sh
  - seed-manifests.sh
  - seed-skills.sh
  - seed-presets.sh
  # --- 安全看板客户端插件（DSH Web UI slot，依赖 sec-suite 的 /silksec/dashboard RPC）---
  - dsh-plugin-sec-dashboard.index.js
  - dsh-plugin-sec-dashboard.client.js
  - dsh-plugin-sec-dashboard.patch.yml
  - sec-dashboard-plugin-setup.sh
  # --- 丝之歌全局主题客户端插件（设计规范：doc/silksong-theme-design.md）---
  - dsh-plugin-theme-silksong.index.js
  - dsh-plugin-theme-silksong.client.js
  - dsh-plugin-theme-silksong.patch.yml
  - theme-silksong-plugin-setup.sh
  # --- program_id 回填迁移（P6 一次性脚本）---
  - backfill-program.js
  # --- 定时任务迁移（P12：once 重复创建 → interval 固定实体，幂等）---
  - migrate-scheduled-tasks.js
  # --- 事实迁移（P11：遗留 blackboard → facts 事实图谱，幂等）---
  - migrate-blackboard-to-facts.js
  # --- 数据保留期清理（审计 S7 / output-retention 等价）---
  - retention.sh
  # --- SQLite 一致性快照备份 + 紧急恢复（P0-5：DB down 应急 + 集中存储归宿）---
  - silksec-backup.sh
  - silksec-restore.sh
  # --- 情报刷新（intel-feeder v1）---
  - intel-refresh.sh
  # --- CyberStrikeAI 历史数据导入器 ---
  - import-cyberstrikeai.py
  # --- 向量嵌入模块（experience-hub 语义检索）---
  - embeddings.index.js
  - embeddings-setup.sh
  # --- 靶场回归评测 ---
  - eval-run.js
  - eval-cases.list
  # --- 浏览器 fork（+SEC_FLOW_PROXY 流量入总线）---
  - sec-browser-plugin-setup.sh
  - dsh-browser-upstream.index.js
  - dsh-browser-upstream.browser-manager.js
  # --- headless worker 模型熔断回退（2026-08-24 线上修复固化，幂等）---
  - headless-failover-setup.sh
  # --- 社区插件锁（pin 版本 + hash，先扫后装）---
  - plugins.lock
services:
  - silksecagent
  - silksecagent-edge
  - silksec-proxy-rotator
  - silksec-xray
