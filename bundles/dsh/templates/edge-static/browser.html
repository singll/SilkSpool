<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SilkSec 共享浏览器</title>
<style>
  body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e6e6e6;max-width:960px;margin:40px auto;padding:0 16px}
  h1{font-size:20px} h2{font-size:14px;color:#9aa0a6;margin-top:28px}
  .card{background:#171a21;border:1px solid #2a2f3a;border-radius:8px;padding:12px 14px;margin:8px 0}
  a{color:#7aa2f7;text-decoration:none} a:hover{text-decoration:underline}
  .muted{color:#6b7280;font-size:12px;word-break:break-all}
  input{background:#0f1115;border:1px solid #2a2f3a;color:#e6e6e6;border-radius:6px;padding:8px 10px;width:70%}
  button{background:#7aa2f7;border:none;color:#0f1115;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
  button.close{background:#3a2f2f;color:#f77a7a;font-weight:400;padding:2px 10px;font-size:12px}
  .tag{display:inline-block;background:#2a2f3a;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:6px}
</style>
</head>
<body>
<h1>SilkSec 共享浏览器 <span class="tag">人机共用登录态</span><span class="tag">CDP 9222</span></h1>
<p class="muted">agent 与你共用同一浏览器实例与同一份 Cookie。登录完目标站点，agent 侧即刻可用。</p>

<h2>新开标签页</h2>
<div class="card">
  <input id="url" placeholder="https://目标地址（仅授权目标）">
  <button onclick="openTab()">打开</button>
</div>

<h2>当前标签页</h2>
<div id="list">加载中…</div>

<h2>说明</h2>
<div class="card muted">
  inspect 链接统一走域名 wss 通道（绕过 https 前端 + ws:// 混合内容拦截）。DevTools 打开后若空白：刷新一次；确认 basicauth 已登录。
</div>

<script>
const REV = '@782af9cb30a53f54487e5d2e44738645a8ec457c';
const WS_HOST = 'browser.silksecagent.singll.net';
function inspectUrl(id){
  return 'https://chrome-devtools-frontend.appspot.com/serve_rev/' + REV + '/inspector.html?wss=' + WS_HOST + '/devtools/page/' + id;
}
async function load(){
  const r = await fetch('/json', {headers:{'Accept':'application/json'}});
  const tabs = await r.json();
  const el = document.getElementById('list');
  const pages = tabs.filter(t=>t.type==='page');
  if(!pages.length){ el.innerHTML = '<div class="card muted">无标签页</div>'; return; }
  el.innerHTML = pages.map(t=>
    '<div class="card"><b>' + (t.title||'(无标题)') + '</b> <button class="close" onclick="closeTab(\'' + t.id + '\')">关闭</button><br>' +
    '<span class="muted">' + t.url + '</span><br>' +
    '<a href="' + inspectUrl(t.id) + '" target="_blank">inspect（可交互）</a></div>'
  ).join('');
}
async function openTab(){
  const u = document.getElementById('url').value.trim();
  if(!u) return;
  await fetch('/json/new?' + encodeURIComponent(u), {method:'PUT'}).catch(()=>{});
  document.getElementById('url').value = '';
  setTimeout(load, 1200);
}
async function closeTab(id){
  await fetch('/json/close/' + id).catch(()=>{});
  setTimeout(load, 600);
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
