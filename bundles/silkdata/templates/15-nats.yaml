services:
  nats:
    image: nats:2.10-alpine
    container_name: ${APP_PREFIX:-sp-}nats
    restart: unless-stopped
    command: -js -sd /data -m 8222
    volumes:
      - kp-nats-data:/data
    ports:
      - "4222:4222"          # 分离后对 LAN 发布，供 keeper 应用层跨机连接
    networks:
      - kp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
