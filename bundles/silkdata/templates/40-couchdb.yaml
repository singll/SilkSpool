# ==============================================================================
#  CouchDB 配置 - Obsidian LiveSync 同步后端（随数据层迁到 silkdata）
#  通用模板；当前 proddata 位于 prod，客户端复用 https://couchdb.singll.net。
# ==============================================================================

services:
  couchdb:
    image: couchdb:3.3@sha256:307a3f5276f64c0db28f226b7b5c180b8f2c851afa681cfb4fbb1b1fe7fd5587
    container_name: ${APP_PREFIX:-sp-}couchdb
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_SECRET=${COUCHDB_SECRET}
    volumes:
      - ./couchdb/10-livesync.ini:/opt/couchdb/etc/local.d/10-livesync.ini:ro
      - kp-couchdb-data:/opt/couchdb/data
      - kp-couchdb-config:/opt/couchdb/etc/local.d
    ports:
      - "5984:5984"
    networks:
      - kp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
