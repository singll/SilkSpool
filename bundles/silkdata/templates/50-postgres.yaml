# ==============================================================================
#  PostgreSQL - 数据层统一服务名 postgres（消费方通过 outputs 或 MagicDNS 连接）
#  分离后对 LAN 发布 5432；跨机地址由 spool 的 endpoint 拓扑解析注入。
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    container_name: ${APP_PREFIX:-sp-}postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_DB=bellkeeper
      - POSTGRES_USER=bellkeeper
      - POSTGRES_PASSWORD=${BELLKEEPER_DB_PASSWORD:-bellkeeper123}
    volumes:
      - kp-bellkeeper-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # 分离后对 LAN 发布，供 keeper 应用层跨机连接
    networks:
      - kp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellkeeper -d bellkeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
