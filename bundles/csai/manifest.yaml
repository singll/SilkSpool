name: csai
type: script
defaults:
  - path: .env
    content: |
      # ==============================================================================
      #  CyberStrikeAI Environment Variables (systemd EnvironmentFile 注入)
      # ==============================================================================

      # --- AI 通道 API Key（config.yaml 中以 ${OPENAI_API_KEY} 引用，也可在 Web UI 配置）---
      OPENAI_API_KEY=CHANGE_ME_api_key
templates:
  - setup.sh
  - tools-manager.sh
  - cyberstrikeai.service
  # --- 代理池（免费代理采集/验证/分级/轮换网关/MCP）---
  - proxy-pool-setup.sh
  - proxy-pool-run-refresh.sh
  - proxy-scraper-checker.toml
  - proxy_grade.py
  - mcp_proxy_pool.py
  - csai-proxy-rotator.service
  - csai-proxy-refresh.service
services:
  - cyberstrikeai
  - csai-proxy-rotator
