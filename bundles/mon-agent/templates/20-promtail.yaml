# ==============================================================================
#  Promtail - 采集本机 docker 容器 stdout，推送到 silkdata:3100 的 Loki
#  用 docker service discovery（docker_sd_configs）经 docker.sock 直接拉日志流，
#  无需挂 /var/lib/docker/containers。配置 promtail-config.yml 每机一份经 sync_rules 下发。
#  mem_limit 200m：护栏。
# ==============================================================================

services:
  promtail:
    image: grafana/promtail:3.4.2
    container_name: ${APP_PREFIX:-sp-}promtail
    restart: unless-stopped
    mem_limit: 200m
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monagent-positions:/positions
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monagent-net
