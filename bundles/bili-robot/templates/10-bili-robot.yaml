---
name: bili-robot

services:
  bili-robot:
    image: bili-robot:1.2.0-persona
    container_name: ${APP_PREFIX:-sp-}bili-robot
    restart: unless-stopped
    working_dir: /app
    command: ["-f", "etc/bilidanmaku-api.yaml"]
    env_file:
      - bili.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24@sha256:d2d2bc1c84f7e60d7d2438a3836ae7d0c847f4888464e7ec9ba3a1339a1ee804 AS build

        ENV CGO_ENABLED=0 \
            GOPROXY=https://goproxy.cn,direct \
            GONOPROXY=github.com/singll/BilibiliDanmuRobot-Core

        WORKDIR /src
        # 固定 fork 提交；主程序 go.mod 同时固定 Core 人格实现。
        RUN git init -q . \
         && git remote add origin https://github.com/singll/BilibiliDanmuRobot.git \
         && git fetch -q --depth 1 origin 7976580d669dcc5992cba9283792781e0751dd57 \
         && git checkout -q FETCH_HEAD \
         && go build -trimpath -ldflags "-s -w -X main.Version=1.2.0-persona" -o /out/bili-robot ./cli

        FROM alpine:3.20

        RUN apk add --no-cache ca-certificates tzdata

        COPY --from=build /out/bili-robot /usr/local/bin/bili-robot

        WORKDIR /app

        ENTRYPOINT ["/usr/local/bin/bili-robot"]
        CMD ["-f", "etc/bilidanmaku-api.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /usr/local/bin/bili-robot >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
