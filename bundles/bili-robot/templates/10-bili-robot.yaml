---
name: bili-robot

services:
  bili-robot:
    image: bili-robot:1.1.23
    container_name: ${APP_PREFIX:-sp-}bili-robot
    restart: unless-stopped
    working_dir: /app
    command: ["-f", "etc/bilidanmaku-api.yaml"]
    env_file:
      - bili.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build

        RUN apk add --no-cache git ca-certificates

        ENV CGO_ENABLED=0 \
            GOPROXY=https://proxy.golang.org,direct

        WORKDIR /src
        RUN git init -q . \
         && git remote add origin https://github.com/Hello-Moeka/BilibiliDanmuRobot.git \
         && git fetch -q --depth 1 origin 1a2bf4a0fa7cc49442b1603f556a2c847eb3381a \
         && git checkout -q FETCH_HEAD \
         && go build -trimpath -ldflags "-s -w" -o /out/bili-robot ./cli/bilidanmaku.go

        FROM alpine:3.20

        RUN apk add --no-cache ca-certificates tzdata

        COPY --from=build /out/bili-robot /usr/local/bin/bili-robot

        WORKDIR /app

        ENTRYPOINT ["/usr/local/bin/bili-robot"]
        CMD ["-f", "etc/bilidanmaku-api.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /usr/local/bin/bili-robot >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
